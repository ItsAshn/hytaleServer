name: hytale-server

services:
  hytale:
    # Default: build the image locally from this repo.
    # To use the prebuilt image from GitHub Container Registry instead,
    # comment out "build: ." and set:
    #   image: ghcr.io/itsashn/hytale-server:main
    build: .
    image: hytale-server:local
    pull_policy: build
    container_name: hytale-server
    restart: unless-stopped
    ports:
      # Hytale speaks QUIC over UDP 5520 (not TCP!). Forward UDP 5520 on your
      # router to this host for internet play.
      - "5520:5520/udp"
    volumes:
      # All mutable state lives here: server files, worlds, config, logs and
      # the persisted auth (auth.enc + downloader credentials + machine-id).
      # Back up this folder and your server is fully backed up.
      - ./data:/data
    env_file:
      - path: .env
        required: false
    environment:
      # Defaults; override in .env
      MEMORY: ${MEMORY:-4G}
      SERVER_NAME: ${SERVER_NAME:-Hytale Server}
      MAX_PLAYERS: ${MAX_PLAYERS:-20}
      MAX_VIEW_RADIUS: ${MAX_VIEW_RADIUS:-12}
      PATCHLINE: ${PATCHLINE:-release}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    # Interactive console: attach with `docker attach hytale-server`
    # (detach with Ctrl+P Ctrl+Q).
    stdin_open: true
    tty: true
    # Give the server time to save the world on shutdown.
    stop_grace_period: 60s

  # ---------------------------------------------------------------------------
  # Optional: keeps a DNS hostname pointed at your (changing) home IP.
  # This is the dynamic-IP half of the setup — players connect to
  #   <DDNS_HOSTNAME>:5520
  # and never need to know your current IP. Enable with:
  #   docker compose --profile ddns up -d
  # ---------------------------------------------------------------------------
  ddns-updater:
    # Small sidecar image (alpine + bash/curl/jq) that runs update-ddns.sh.
    build:
      context: .
      dockerfile: Dockerfile.ddns
    image: hytale-ddns:local
    pull_policy: build
    container_name: hytale-ddns
    restart: unless-stopped
    profiles: ["ddns"]
    depends_on:
      - hytale
    volumes:
      - ./scripts:/scripts:ro
    env_file:
      - path: .env
        required: false
    environment:
      DDNS_PROVIDER: ${DDNS_PROVIDER:-duckdns}
      DDNS_HOSTNAME: ${DDNS_HOSTNAME:-}
      DDNS_TOKEN: ${DDNS_TOKEN:-}
      DDNS_USERNAME: ${DDNS_USERNAME:-}
      DDNS_PASSWORD: ${DDNS_PASSWORD:-}
      DDNS_INTERVAL: ${DDNS_INTERVAL:-300}
      DDNS_UPDATE_URL: ${DDNS_UPDATE_URL:-}
      # cloudflare provider (your own domain)
      DDNS_API_TOKEN: ${DDNS_API_TOKEN:-}
      DDNS_ZONE_NAME: ${DDNS_ZONE_NAME:-}
      DDNS_TTL: ${DDNS_TTL:-1}
      DDNS_PROXIED: ${DDNS_PROXIED:-false}

  # ---------------------------------------------------------------------------
  # Optional: Caddy reverse proxy for your own domain — no API token needed.
  # Use this instead of the Cloudflare DDNS provider when your domain's DNS is
  # NOT on Cloudflare (or you simply don't want to hand out an API token).
  # Caddy obtains and renews a TLS certificate for CADDY_DOMAIN via the ACME
  # HTTP-01 challenge, which only requires:
  #   1. an A/AAAA record for CADDY_DOMAIN pointing at this host's public IP
  #      (the ddns-updater "manual" provider can tell you that IP), and
  #   2. the HTTP port below reachable from the internet.
  # The game itself still uses UDP 5520 directly — Caddy only secures the
  # domain (e.g. for a status page or future web tooling).
  # Enable with:
  #   docker compose --profile caddy up -d
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: hytale-caddy
    restart: unless-stopped
    profiles: ["caddy"]
    depends_on:
      - hytale
    ports:
      # The HTTP port is customizable: set CADDY_HTTP_PORT in .env when 80 is
      # already taken on this host. Whatever you choose must be reachable from
      # the internet for certificate issuance/renewal (HTTP-01 challenge).
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - path: .env
        required: false
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-}

volumes:
  # Persist Caddy's issued certificates and ACME account across restarts so
  # renewals stay hands-off and you don't re-hit rate limits.
  caddy_data:
  caddy_config:
